 WAW_BOOKMARK_DESC:0 "The time since the collapse has not been kind to Washington. The state has been plagued by growing tension between the natives and the colonists, while some measures have been taken, violence still occurs. The military industries have a stranglehold on the economy, and appeasing them seems impossible. All of this while California begins to stir to the South."
 
 
 lwashington.1.t:0 "The Matter Of Native Rights"
 lwashington.1.d:0 "Over the past few years, land and fishing rights have become an ever-increasing issue with the natives in the region. Protests are becoming more prevalent, and recently things have come to a head when an unarmed man was killed by the local police due to a fishing dispute. Things could get out of hand if these matters aren't addressed properly."
 lwashington.1.a:0 "This can be resolved if we make some concessions"
 lwashington.1.b:0 "This matter will only be fixed by pushing through it. Forcefully."
 lwashington.2.t:0 "Washington Demands Salem Submit"
 lwashington.2.d:0 "A message from the Evergreen Union has arrived to us today. Their demands are relatively straightforward. They are demanding that our government resigns effective immediately, and that they are allowed to fill those positions in whatever way they choose. This is absolutely unacceptable, and surely they are trying to goad us into getting some kind of casus belli in the name of national security. We do not have too many options however..."
 lwashington.2.a:0 "Hopefully they are reasonable..."
 lwashington.2.b:0 "A casus belli they will have!"
 lwashington.3.t:0 "Washington Demands Boise Submit"
 lwashington.3.d:0 "A message from the Evergreen Union has arrived to us today. Their demands are relatively straightforward. They are demanding that our government resigns effective immediately, and that they are allowed to fill those positions in whatever way they choose. This is absolutely unacceptable, and surely they are trying to goad us into getting some kind of casus belli in the name of national security. We do not have too many options however..."
 lwashington.3.a:0 "Hopefully they are reasonable..."
 lwashington.3.b:0 "A casus belli they will have!"
 lwashington.4.t:0 "Washington Demands Compliance"
 lwashington.4.d:0 "It seems that Washington has given us an ultimatum in their so-called "Crusade For Democracy". They are demanding that we either allow them extreme control over our government, or they will do it themselves. They are cowards hiding behind California's military, but our options are limited."
 lwashington.4.a:0 "Our hands are tied..."
 lwashington.4.b:0 "We will stand against this insult!"
 lwashington.5.t:0 "Washington Demands Compliance"
 lwashington.5.d:0 "It seems that Washington has given us an ultimatum in their so-called "Crusade For Democracy". They are demanding that we either allow them extreme control over our government, or they will do it themselves. They are cowards hiding behind California's military, but our options are limited."
 lwashington.5.a:0 "Our hands are tied..."
 lwashington.5.b:0 "We will stand against this insult!"
 lwashington.6.t:0 "Olympia Sends A Letter"
 lwashington.6.d:0 "Envoys from Washington have come to our state today to discuss the rising tensions in the region, and wish to make a firm stance that we should ally with them to keep our people safe. It seems they have made a commitment to democratic values, so this is only a benefit."
 lwashington.6.a:0 "Welcome In"
 nwashington.1.t:0 "Our Experiment"
 nwashington.1.d:0 "We have won the fight against those who stole everything from us all those years ago. The fight to make ourselves known is not finished however, this is only a breath. We must decide how our new style of government will form. This is not the world of hundreds of years ago, we have learned that without a central authority, we will simply be pushed aside once more. There are calls from all sides for a strong Native central government, and others for regional tribe leadership. We must decide quickly, as our neighbors will likely take advantage of this rocky ground."
 nwashington.1.a:0 "Regional Councils will allow larger borders"
 nwashington.1.b:0 "A  single banner for the Northwest"
 nwashington.2.t:0 "The Salish Tribes Look For Peace"
 nwashington.2.d:0 "The newly formed state to our North has come to us today looking to sign a pact of non-aggression. They have recently overthrown their governments and it seems as though their momentum is continuing. We do not want to seem weak and that we cannot take them out in a heartbeat, but the tribes in our state may raise some eyebrows if it gets out that we did not take this offer. It would be wise for us to consider our options here before doing anything too rash."
 nwashington.2.a:0 "Sign the pact we shall!"
 nwashington.2.b:0 "Their recklessness cannot be trusted in the slightest."
 nwashington.3.t:0 "Native Outreach"
 nwashington.3.d:0 "The new indigenous state in Washington has made a very interesting proposal to us, a partition of Columbia. While the lands offered are not exceptionally meaningful either population or resource-wise, the mountains it provides would give us an even easier to defend Western border."
 nwashington.3.a:0 "Expect our aid."
 nwashington.3.b:0 "What a pitiful offer."
 nwashington.4.t:0 "Native Outreach"
 nwashington.4.d:0 "The new indigenous state in Washington has made a very interesting proposal to us, a partition of Idaho. They are essentially offering a 50% split of the state, and while this new regime is not the most trust-worthy, this is an enticing offer."
 nwashington.4.a:0 "Expect our aid."
 nwashington.4.b:0 "What a pitiful offer."
 fwashington.1.t:0 "The Pacific Makes Contact"
 fwashington.1.d:0 "After the struggles that they have had against insurrectionists, the state of Washington has regained full government control and has contacted us. It is now time to integrate them into our federal system so that we can bring America back to what it once was."
 fwashington.1.a:0 "It's about time."
 fwashington.2.t:0 "Washington Proposes Mutual Security"
 fwashington.2.d:0 "We have been notified that due to the recent full scale wars within both of our borders with the native population, Washington is now insisting that we form a merger between our two state to promote a sense of unity and stability. Perhaps their intentions are pure, but there are major doubts from many members of our government."
 fwashington.2.a:0 "We have little choice but to accept."
 fwashington.2.b:0 "Clearly they don't expect us to be this stupid?"
 fwashington.3.t:0 "Operation: Vicky"
 fwashington.3.d:0 "DC has notified us that our current mission is the seizing of Columbian territories. This will allow better Federal control over the Pacific, and hopefully give us a better position to serve as a counter-balance to the traitors in California."
 fwashington.3.a:0 "Roger that."
 fwashington.4.t:0 "Operation: Tuber"
 fwashington.4.d:0 "The Federal government has issued us with a project, the total reclamation of the lands in Idaho. They see the resources there us necessary to safeguard the pacific, and spreading our mining operations there as a boon to our ideals and mission. They are insisting it happens quickly."
 fwashington.4.a:0 "It will be completed."
 fwashington.5.t:0 "Operation: Aurora"
 fwashington.5.d:0 "Alaska is the next target being given to us by DC, which makes sense. It could give us a superior naval edge over California in the North, and the sheer size could open up many future mining projects. We should act on this quickly so as to not waste valuable time."
 fwashington.5.a:0 "They know what's best for us."
 fwashington.6.t:0 "Operation: Fool's Gold"
 fwashington.6.d:0 "We have been instructed to fully annex the Yukon, which while resource-poor, would provide a greater buffer for supply lines leading into Alaska, as if those are severed, our troops would be stranded in the ice. They should not be able to put up too much a fight with this one."
 fwashington.6.a:0 "This'll be easy."
 fwashington.7.t:0 "Operation: Stratus"
 fwashington.7.d:0 "According to high command, only the western-most parts of Montana are to be annexed by us. It seems that they have bigger plans for the rest of the state, but are keeping very quiet about what those could be. Ideally we get something good out of this."
 fwashington.7.a:0 "Who are we to question?"


 
